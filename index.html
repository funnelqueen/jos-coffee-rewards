<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Jo’s Coffee Rewards (Test)</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;margin:0;padding:24px;background:#faf8f6}
  .card{max-width:420px;margin:0 auto;padding:20px;border-radius:14px;background:#fff;
        box-shadow:0 6px 20px rgba(0,0,0,.08)}
  h1{margin:0 0 6px} .sub{color:#666;margin-bottom:16px}
  input,button{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #ddd;font-size:16px}
  button{border:0;background:#7a5230;color:#fff;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:grid;gap:10px;margin:12px 0}
  .muted{color:#777;font-size:14px}
  .ok{color:#0a7a41} .err{color:#b00020}
  pre{white-space:pre-wrap;background:#f3f3f3;border-radius:8px;padding:10px}
</style>
</head>
<body>
  <div class="card">
    <h1>Jo’s Coffee Rewards</h1>
    <div class="sub">Test connection to Google Sheets API</div>

    <div class="row">
      <input id="name" placeholder="Your name (optional)"/>
      <input id="phone" placeholder="Your phone (required)"/>
      <button id="btnFetch" onclick="getProfile()">See my beans</button>
      <button id="btnCheckin" onclick="doCheckin()">Check-in (+1 bean)</button>
    </div>

    <div class="row">
      <div id="status" class="muted">Status: idle</div>
      <pre id="debug"></pre>
    </div>
  </div>

<script>
// ✅ Paste your values here:
const API_URL = "https://script.google.com/macros/s/AKfycbzQDmfEkqsElsJFVuDxc05T6dIOmTmWQ_jsW-4IxRpkOp-heQf-JkwS_766hdIxknA-kQ/exec";
const API_KEY = "joscoffee_2n48f73r9K394ndskf82n";

const $ = s => document.querySelector(s);
const statusEl = $('#status');
const dbg = $('#debug');

function show(msg, ok=false){
  statusEl.textContent = 'Status: ' + msg;
  statusEl.className = ok ? 'muted ok' : 'muted';
  console.log(msg);
}
function showErr(err){
  statusEl.textContent = 'Status: ' + err;
  statusEl.className = 'muted err';
  console.error(err);
}
function dump(obj){ dbg.textContent = JSON.stringify(obj,null,2); }

async function callAPI(payload){
  show('calling API…');
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ api_key: API_KEY, ...payload })
    });
    const data = await res.json();
    dump(data);
    return data;
  }catch(e){
    dump({network_error:String(e)});
    throw e;
  }
}

async function getProfile(){
  const phone = $('#phone').value.trim();
  const name = $('#name').value.trim();
  if(!phone){ return showErr('Phone is required'); }
  try{
    const data = await callAPI({ action:'get_profile', phone });
    if(!data.ok){ return showErr(data.error || 'API error'); }
    show('Profile loaded.', true);
  }catch(e){ showErr('Network/API error'); }
}

async function doCheckin(){
  const phone = $('#phone').value.trim();
  const name = $('#name').value.trim();
  if(!phone){ return showErr('Phone is required'); }
  try{
    const data = await callAPI({ action:'checkin', phone, name });
    if(!data.ok){ return showErr(data.message || data.error || 'API error'); }
    show(data.earned_reward ? '🎉 Free drink unlocked!' : 'Bean added!', true);
  }catch(e){ showErr('Network/API error'); }
}
</script>
</body>
</html>
